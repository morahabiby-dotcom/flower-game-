<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flower Game</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff3f8;--card:#fff;--tx:#3a1b2e;--ac:#c2185b;--op:#0288d1}
:root[data-theme="dark"]{--bg:#2b1624;--card:#3d2033;--tx:#fff0f7;--ac:#f48fb1;--op:#0277bd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1624;--card:#3d2033;--tx:#fff0f7;--ac:#f48fb1;--op:#0277bd}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;text-align:center}
main{max-width:520px;margin:0 auto;padding:16px}
h1{color:var(--ac);margin:8px 0;font-size:1.9rem}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 3px 10px #0002}
p{font-size:1.2rem;margin:8px 0}
button{font:inherit;font-size:1.25rem;border:0;border-radius:16px;padding:14px 18px;cursor:pointer;margin:6px 4px;color:#fff;background:var(--ac)}
button:active{transform:scale(.96)}
.ans{display:block;width:100%;background:var(--op)}
.ans.ok{background:#2e9e3e}.ans.no{background:#e57373}
.hide{display:none}
.big{font-size:4.5rem;line-height:1.1}
.row{display:flex;gap:8px}.row .ans{flex:1}
</style></head><body><main>
<h1>🌸 Flower Game</h1>

<section id="s1" class="card">
<div class="big">🌼🌹🌺🪷</div>
<p>Let's learn about flowers!<br>Tap the right answer. It's easy!</p>
<button id="go">Start ➜</button>
</section>

<section id="s2" class="card hide">
<p id="prog"></p>
<div class="big" id="pic"></div>
<p id="q" style="font-weight:bold"></p>
<div id="opts"></div>
<p id="fb" style="min-height:2.4em"></p>
<button id="nx" class="hide">Next ➜</button>
</section>

<section id="s3" class="card hide">
<div class="big" id="stars"></div>
<h1 id="sc"></h1>
<p>You are a super flower scientist! 🎉</p>
<p>🔎 Next: go outside and look at a real flower with a magnifier!</p>
<button id="again">Play again 🔄</button>
</section>

<script>
const $=id=>document.getElementById(id);
const Q=[
["🌼","What is this flower called?",["daisy","rose","thistle"],0],
["🌹","What is this flower called?",["hibiscus","rose","water lily"],1],
["🌺","What is this flower called?",["hibiscus","daisy","rose"],0],
["🪷","What is this flower called?",["water lily","daisy","rose"],0],
["🌸➜🫘","Flowers make seeds. True or false?",["True ✅","False ❌"],0],
["🫘➜🌱","Seeds grow into new plants. True or false?",["True ✅","False ❌"],0],
["🌷🌵","All plants have exactly the same flowers. True or false?",["True ✅","False ❌"],1],
["🔍","Which tool helps you see a flower up close?",["magnifier","pencil only","scissors"],0],
["🌺🌍","The world's largest flower is called Rafflesia. True or false?",["True ✅","False ❌"],0]];
let i=0,s=0;
function show(id){["s1","s2","s3"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function ask(){const [p,q,o,a]=Q[i];$("prog").textContent="Question "+(i+1)+" of "+Q.length;$("pic").textContent=p;$("q").textContent=q;$("fb").textContent="";$("nx").classList.add("hide");$("opts").innerHTML="";
const row=document.createElement("div");if(o.length==2)row.className="row";$("opts").appendChild(row);
o.forEach((t,k)=>{const b=document.createElement("button");b.className="ans";b.textContent=t;b.onclick=()=>{if($("nx").classList.contains("hide")){
if(k===a){s++;b.classList.add("ok");$("fb").textContent="⭐ Yes! Well done!"}else{b.classList.add("no");row.children[a].classList.add("ok");$("fb").textContent="Nice try! The green one is right. 💚"}
$("nx").classList.remove("hide");$("nx").textContent=i<Q.length-1?"Next ➜":"See my stars ⭐"}};row.appendChild(b)})}
$("go").onclick=()=>{i=0;s=0;show("s2");ask()};
$("nx").onclick=()=>{i++;if(i<Q.length)ask();else{$("stars").textContent="⭐".repeat(Math.max(1,Math.round(s/3)));$("sc").textContent="You got "+s+" out of "+Q.length+"!";show("s3")}};
$("again").onclick=()=>show("s1");
</script></main></body></html>
